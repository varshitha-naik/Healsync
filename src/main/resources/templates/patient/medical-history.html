<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical History - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Medical History â€” follows clinical design system v1 */ -->
    <div class="app-shell">
        <div th:replace="fragments/patient-header :: header"></div>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Patient / Records</p>
                    <h1>Medical history</h1>
                </div>
            </header>

            <main class="page-content">
                <div id="loading" class="card loading-block">Loading history...</div>
                <section id="historyTable" class="appointment-history" style="display: none;">
                    <div id="historyBody" class="appointment-history"></div>
                </section>
            </main>
        </div>
    </div>

    <script>
        async function loadHistory() {
            const token = localStorage.getItem('jwtToken');
            if (!token) window.location.href = '/login';

            try {
                const meRes = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
                const user = await meRes.json();
                const res = await fetch(`/api/patient/history/${user.userId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) throw new Error("Failed to load history");

                let history = await res.json();
                history = history.filter(item => item.status === 'COMPLETED');
                history.sort((a, b) => new Date(b.startDateTime) - new Date(a.startDateTime));
                renderHistory(history);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('historyTable').style.display = 'grid';
            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerText = "Error loading medical history.";
            }
        }

        function renderHistory(history) {
            const body = document.getElementById('historyBody');
            body.innerHTML = '';

            if (history.length === 0) {
                body.innerHTML = '<div class="empty-state"><p>No completed appointments in your medical history yet.</p></div>';
                return;
            }

            history.forEach(h => {
                const date = new Date(h.startDateTime).toLocaleDateString() + ' ' + new Date(h.startDateTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const card = document.createElement('article');
                card.className = 'history-card';
                card.innerHTML = `<div class="section-header" style="margin-bottom: 8px;"><h3>${h.doctorName ? h.doctorName : 'Dr. ' + h.doctorId}</h3><span class="status-badge status-completed">${h.status}</span></div><p>${date}</p><p>${h.reason || '-'}</p><p>${h.doctorNotes || 'No notes shared.'}</p>`;
                body.appendChild(card);
            });
        }

        window.onload = loadHistory;
    </script>
</body>

</html>
