<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Doctor - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Find Doctor - follows clinical design system v1 */ -->
    <div class="app-shell">
        <div th:replace="fragments/patient-header :: header"></div>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Patient / Book Appointment</p>
                    <h1>Find a doctor</h1>
                </div>
            </header>

            <main class="page-content">
                <section class="card">
                    <div class="field">
                        <label for="searchInput">Search</label>
                        <input type="text" id="searchInput" placeholder="Search by name or specialization" onkeyup="filterDoctors()">
                    </div>
                </section>

                <section class="table-card" style="margin-top: 24px;">
                    <div id="loading" class="loading-block" style="padding: 24px;">Loading doctors...</div>
                    <table id="doctorsTable" class="data-table" style="display: none;">
                        <thead>
                            <tr>
                                <th>Doctor</th>
                                <th>Specialization</th>
                                <th>Email</th>
                                <th class="actions-cell">Action</th>
                            </tr>
                        </thead>
                        <tbody id="doctorsBody"></tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>

    <script>
        let allDoctors = [];

        async function loadDoctors() {
            const token = localStorage.getItem('jwtToken');
            if (!token) window.location.href = '/login';

            try {
                const res = await fetch('/api/patient/doctors', { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) throw new Error("Failed to load doctors");

                allDoctors = await res.json();
                renderDoctors(allDoctors);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('doctorsTable').style.display = 'table';
            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerText = "Error loading doctors.";
            }
        }

        function renderDoctors(doctors) {
            const tbody = document.getElementById('doctorsBody');
            tbody.innerHTML = '';

            if (doctors.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">No doctors found.</td></tr>';
                return;
            }

            doctors.forEach(d => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="user-summary">
                            <img class="avatar-circle" style="object-fit: cover;" src="${escapeHtml(getDoctorPhotoUrl(d.profilePhotoUrl))}" alt="${escapeHtml(d.name || 'Doctor')}" onerror="handleDoctorImageError(this)">
                            <div class="user-meta">
                                <p class="user-name">${escapeHtml(d.name || 'Unknown')}</p>
                                <p class="user-email">Doctor ID: ${d.doctorId}</p>
                            </div>
                        </div>
                    </td>
                    <td>${escapeHtml(d.specialization || 'General')}</td>
                    <td>${escapeHtml(d.email || '-')}</td>
                    <td class="actions-cell"><a href="/patient/appointments?doctorId=${d.doctorId}" class="btn-primary">Book</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterDoctors() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allDoctors.filter(d => (d.name && d.name.toLowerCase().includes(query)) || (d.specialization && d.specialization.toLowerCase().includes(query)));
            renderDoctors(filtered);
        }

        function getDoctorPhotoUrl(photoUrl) {
            if (!photoUrl || !photoUrl.trim()) return '/images/default-doctor.svg';
            return photoUrl.trim();
        }

        function handleDoctorImageError(img) {
            if (img.dataset.fallbackApplied === 'true') return;
            img.dataset.fallbackApplied = 'true';
            img.src = '/images/default-doctor.svg';
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onload = loadDoctors;
    </script>
</body>

</html>
