<aside th:fragment="navbar" class="app-sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-mark">HS</div>
        <div class="sidebar-brand-text">
            <h1>HealSync</h1>
            <p>Doctor workspace</p>
        </div>
    </div>

    <nav class="sidebar-nav">
        <a href="/doctor/dashboard" class="sidebar-link" data-match="/doctor/dashboard">
            <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v10h12V10"/></svg>
            <span>Dashboard</span>
        </a>
        <a href="/doctor/appointments" class="sidebar-link" data-match="/doctor/appointments">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
            <span>My Schedule</span>
        </a>
        <a href="/doctor/patients" class="sidebar-link" data-match="/doctor/patients">
            <svg viewBox="0 0 24 24"><path d="M16 19a4 4 0 0 0-8 0"/><circle cx="12" cy="9" r="3"/><path d="M5 19a3 3 0 0 1 3-3"/><path d="M19 19a3 3 0 0 0-3-3"/></svg>
            <span>Patients</span>
        </a>
        <a href="/doctor/availability" class="sidebar-link" data-match="/doctor/availability">
            <svg viewBox="0 0 24 24"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="8"/></svg>
            <span>Availability</span>
        </a>
        <a href="/doctor/profile" class="sidebar-link" data-match="/doctor/profile">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
            <span>Profile</span>
        </a>
    </nav>

    <div class="sidebar-user">
        <div class="user-summary">
            <div class="avatar-circle" id="doctorInitials">DR</div>
            <div class="user-meta">
                <p class="user-name">Doctor account</p>
                <p class="user-email" id="navUserEmail">doctor@healsync.com</p>
            </div>
        </div>
        <span class="role-badge">Doctor</span>
        <button class="btn-secondary" type="button" onclick="logout()">Logout</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const email = localStorage.getItem('userEmail') || 'doctor@healsync.com';
            const emailNode = document.getElementById('navUserEmail');
            const initialsNode = document.getElementById('doctorInitials');
            const path = window.location.pathname;

            if (emailNode) {
                emailNode.textContent = email;
            }

            if (initialsNode) {
                const initials = email.split('@')[0].split(/[.\-_]/).map(part => part[0]).join('').slice(0, 2).toUpperCase();
                initialsNode.textContent = initials || 'DR';
            }

            document.querySelectorAll('.sidebar-link').forEach(link => {
                const matches = (link.dataset.match || '').split(',');
                if (matches.some(match => match && path.startsWith(match))) {
                    link.classList.add('is-active');
                }
            });
        });

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }
    </script>
</aside>
