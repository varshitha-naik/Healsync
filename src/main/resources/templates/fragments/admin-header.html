<aside th:fragment="adminHeader" class="app-sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-mark">HS</div>
        <div class="sidebar-brand-text">
            <h1>HealSync</h1>
            <p>Clinical operations</p>
        </div>
    </div>

    <nav class="sidebar-nav">
        <a href="/admin/dashboard" class="sidebar-link" data-match="/admin/dashboard">
            <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v10h12V10"/></svg>
            <span>Dashboard</span>
        </a>
        <a href="/admin/appointments" class="sidebar-link" data-match="/admin/appointments">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
            <span>Appointments</span>
        </a>
        <a href="/admin/manage-doctors" class="sidebar-link" data-match="/admin/manage-doctors,/admin/create-doctor">
            <svg viewBox="0 0 24 24"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 20a8 8 0 0 1 16 0"/><path d="M18 8h4M20 6v4"/></svg>
            <span>Doctors</span>
        </a>
        <a href="/admin/users" class="sidebar-link" data-match="/admin/users">
            <svg viewBox="0 0 24 24"><path d="M16 19a4 4 0 0 0-8 0"/><circle cx="12" cy="9" r="3"/><path d="M5 19a3 3 0 0 1 3-3"/><path d="M19 19a3 3 0 0 0-3-3"/></svg>
            <span>Patients</span>
        </a>
        <a href="/admin/audit-logs" class="sidebar-link" data-match="/admin/audit-logs">
            <svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M10 19V9"/><path d="M16 19V13"/><path d="M22 19V7"/></svg>
            <span>Reports</span>
        </a>
        <a href="/admin/medical-summaries" class="sidebar-link" data-match="/admin/medical-summaries">
            <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v3h3"/><path d="M9 12h6M9 16h6"/></svg>
            <span>Medical Summaries</span>
        </a>
    </nav>

    <div class="sidebar-user">
        <div class="user-summary">
            <div class="avatar-circle" id="adminInitials">AD</div>
            <div class="user-meta">
                <p class="user-name">Operations team</p>
                <p class="user-email" id="userEmail">admin@healsync.com</p>
            </div>
        </div>
        <span class="role-badge">Admin</span>
        <button class="btn-secondary" type="button" onclick="logout()">Logout</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const email = localStorage.getItem('userEmail') || 'admin@healsync.com';
            const emailNode = document.getElementById('userEmail');
            const initialsNode = document.getElementById('adminInitials');
            const path = window.location.pathname;

            if (emailNode) {
                emailNode.textContent = email;
            }

            if (initialsNode) {
                const initials = email.split('@')[0].split(/[.\-_]/).map(part => part[0]).join('').slice(0, 2).toUpperCase();
                initialsNode.textContent = initials || 'AD';
            }

            document.querySelectorAll('.sidebar-link').forEach(link => {
                const matches = (link.dataset.match || '').split(',');
                if (matches.some(match => match && path.startsWith(match))) {
                    link.classList.add('is-active');
                }
            });
        });
    </script>
</aside>
