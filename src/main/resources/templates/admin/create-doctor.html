<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Doctor - HealSync Admin</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Create Doctor â€” follows clinical design system v1 */ -->
    <div class="app-shell">
        <th:block th:replace="fragments/admin-header :: adminHeader"></th:block>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Admin / Doctors</p>
                    <h1>Create doctor account</h1>
                </div>
                <div class="topbar-actions">
                    <button class="avatar-button" type="button"><span class="avatar-circle">AD</span></button>
                </div>
            </header>

            <main class="page-content">
                <div class="page-columns">
                    <section class="card">
                        <div class="section-header">
                            <div>
                                <h2>Clinician details</h2>
                                <p class="section-copy">Provision a new doctor and connect them to the clinic roster.</p>
                            </div>
                        </div>
                        <div id="message"></div>
                        <form id="createDoctorForm" class="page-stack">
                            <div class="form-grid">
                                <div class="field">
                                    <label>Email</label>
                                    <input type="email" name="email" required placeholder="doctor@example.com">
                                </div>
                                <div class="field">
                                    <label>Password</label>
                                    <input type="password" name="password" required minlength="6" placeholder="Minimum 6 characters">
                                </div>
                                <div class="field full">
                                    <label>Full name</label>
                                    <input type="text" name="fullName" required placeholder="Dr. John Smith">
                                </div>
                                <div class="field">
                                    <label>Specialization</label>
                                    <select name="specialization" required>
                                        <option value="">Select specialization</option>
                                        <option value="Cardiology">Cardiology</option>
                                        <option value="Dermatology">Dermatology</option>
                                        <option value="Neurology">Neurology</option>
                                        <option value="Pediatrics">Pediatrics</option>
                                        <option value="Orthopedics">Orthopedics</option>
                                        <option value="General Medicine">General Medicine</option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label>License number</label>
                                    <input type="text" name="licenseNumber" required placeholder="MD-12345">
                                </div>
                                <div class="field">
                                    <label>Experience (years)</label>
                                    <input type="number" name="experienceYears" required min="0" placeholder="5">
                                </div>
                                <div class="field">
                                    <label>Clinic</label>
                                    <select name="clinicId" required>
                                        <option value="1">HealSync Medical Center</option>
                                    </select>
                                </div>
                                <div class="field full">
                                    <label>Bio</label>
                                    <textarea name="bio" placeholder="Brief professional biography"></textarea>
                                </div>
                            </div>
                            <div class="horizontal-actions">
                                <button type="button" class="btn-secondary" onclick="window.location.href='/admin/dashboard'">Cancel</button>
                                <button type="submit" class="btn-primary">Create Doctor</button>
                            </div>
                        </form>
                    </section>

                    <aside class="card">
                        <h2>What happens next</h2>
                        <div class="history-list">
                            <div class="detail-card"><label>Account access</label><span>The doctor receives a role-bound login.</span></div>
                            <div class="detail-card"><label>Directory listing</label><span>The new clinician appears in admin doctor management.</span></div>
                            <div class="detail-card"><label>Profile completion</label><span>Photo and availability can be added after setup.</span></div>
                        </div>
                    </aside>
                </div>
            </main>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwtToken');
        const userEmail = localStorage.getItem('userEmail');
        const userRole = localStorage.getItem('userRole');

        if (!token || userRole !== 'ADMIN') {
            window.location.href = '/login';
        }

        document.getElementById('userEmail').textContent = userEmail || 'Admin';

        document.getElementById('createDoctorForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = {
                email: formData.get('email'),
                password: formData.get('password'),
                fullName: formData.get('fullName'),
                specialization: formData.get('specialization'),
                licenseNumber: formData.get('licenseNumber'),
                experienceYears: parseInt(formData.get('experienceYears')),
                clinicId: parseInt(formData.get('clinicId')),
                bio: formData.get('bio')
            };

            try {
                const response = await fetch('/api/admin/doctors', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    document.getElementById('message').innerHTML = `
                        <div class="alert alert-success">
                            Doctor created successfully.<br>
                            <strong>Email:</strong> ${data.email}<br>
                            <strong>Name:</strong> ${data.fullName}<br>
                            Redirecting to dashboard...
                        </div>
                    `;

                    setTimeout(() => {
                        window.location.href = '/admin/dashboard';
                    }, 2000);
                } else {
                    const errText = await response.text();
                    document.getElementById('message').innerHTML = `<div class="alert alert-danger">Failed: ${errText}</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('message').innerHTML = `<div class="alert alert-danger">Check console for error</div>`;
            }
        });
    </script>
</body>

</html>
