<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients by Doctor - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Patients by Doctor — follows clinical design system v1 */ -->
    <div class="app-shell">
        <th:block th:replace="fragments/admin-header :: adminHeader"></th:block>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Admin / Patients</p>
                    <h1>Patients by Doctor</h1>
                </div>
            </header>

            <main class="page-content">
                <section class="card">
                    <div class="section-header">
                        <div>
                            <h2>Patient associations</h2>
                            <p class="section-copy">See which patients are associated with each doctor from appointment activity.</p>
                        </div>
                    </div>
                    <div class="search-toolbar">
                        <div class="field">
                            <label for="searchInput">Search by doctor or patient name</label>
                            <input type="text" id="searchInput" placeholder="Search doctors or patients">
                        </div>
                    </div>
                </section>

                <section class="card" style="margin-top: 24px;">
                    <div id="loadingState" class="loading-block">Loading patient associations...</div>
                    <div id="emptyState" class="empty-state" style="display: none;">
                        <p>No doctors or patient associations found.</p>
                    </div>
                    <div id="doctorGroups" class="doctor-group-list" style="display: none;"></div>
                </section>
            </main>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwtToken');
        const userEmail = localStorage.getItem('userEmail');
        let groupsData = [];

        if (!token) window.location.href = '/login';
        document.getElementById('userEmail').textContent = userEmail;

        async function loadPatientsByDoctor() {
            try {
                const response = await fetch('/api/admin/patients-by-doctor', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    throw new Error('Failed to load patient associations');
                }

                groupsData = await response.json();
                renderGroups(groupsData);
            } catch (error) {
                console.error(error);
                document.getElementById('loadingState').innerText = 'Unable to load patient associations.';
            }
        }

        function renderGroups(groups) {
            const container = document.getElementById('doctorGroups');
            const loading = document.getElementById('loadingState');
            const empty = document.getElementById('emptyState');

            container.innerHTML = '';

            if (!groups.length) {
                loading.style.display = 'none';
                empty.style.display = 'grid';
                container.style.display = 'none';
                return;
            }

            groups.forEach(group => {
                const details = document.createElement('details');
                details.className = 'doctor-group';
                details.open = true;

                const patientsHtml = group.patients.length
                    ? `<div class="patient-list">${group.patients.map(patient => `
                        <article class="patient-item">
                            <div class="patient-item-head">
                                <div>
                                    <h4>${escapeHtml(patient.patientName)}</h4>
                                    <p>${escapeHtml(patient.email || 'No email available')}</p>
                                </div>
                                <span class="status-badge ${getStatusClass(patient.appointmentStatus)}">${formatStatus(patient.appointmentStatus)}</span>
                            </div>
                            <div class="patient-meta-grid">
                                <div class="detail-card">
                                    <label>Last appointment</label>
                                    <span>${formatDate(patient.lastAppointmentDate)}</span>
                                </div>
                                <div class="detail-card">
                                    <label>Status</label>
                                    <span>${formatStatus(patient.appointmentStatus)}</span>
                                </div>
                            </div>
                        </article>
                    `).join('')}</div>`
                    : `<div class="empty-state" style="min-height: 120px;"><p>No patients assigned yet.</p></div>`;

                details.innerHTML = `
                    <summary class="doctor-group-summary">
                        <div class="doctor-group-meta">
                            <img class="avatar-circle" style="object-fit: cover;" src="${escapeHtml(group.profilePhotoUrl || '/images/default-doctor.svg')}" alt="${escapeHtml(group.doctorName)}" onerror="this.src='/images/default-doctor.svg'">
                            <div class="doctor-group-text">
                                <h3>${escapeHtml(group.doctorName)}</h3>
                                <p>${escapeHtml(group.specialization || 'General Medicine')} • ${escapeHtml(group.doctorEmail || 'No email available')}</p>
                            </div>
                        </div>
                        <span class="doctor-group-count">${group.patients.length} patient${group.patients.length === 1 ? '' : 's'}</span>
                    </summary>
                    <div class="doctor-group-body">
                        ${patientsHtml}
                    </div>
                `;

                container.appendChild(details);
            });

            loading.style.display = 'none';
            empty.style.display = 'none';
            container.style.display = 'grid';
        }

        function applyFilter() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                renderGroups(groupsData);
                return;
            }

            const filtered = groupsData
                .map(group => {
                    const doctorMatch =
                        group.doctorName.toLowerCase().includes(query) ||
                        (group.doctorEmail || '').toLowerCase().includes(query) ||
                        (group.specialization || '').toLowerCase().includes(query);

                    return {
                        ...group,
                        patients: doctorMatch
                            ? group.patients
                            : group.patients.filter(patient =>
                                patient.patientName.toLowerCase().includes(query) ||
                                (patient.email || '').toLowerCase().includes(query)
                            )
                    };
                })
                .filter(group =>
                    group.doctorName.toLowerCase().includes(query) ||
                    (group.doctorEmail || '').toLowerCase().includes(query) ||
                    (group.specialization || '').toLowerCase().includes(query) ||
                    group.patients.length > 0
                );

            renderGroups(filtered);
        }

        function formatDate(value) {
            if (!value) return 'No appointment recorded';
            return new Date(value).toLocaleString([], {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatStatus(status) {
            if (!status) return 'Unknown';
            return status.charAt(0) + status.slice(1).toLowerCase();
        }

        function getStatusClass(status) {
            if (status === 'CONFIRMED') return 'status-confirmed';
            if (status === 'COMPLETED') return 'status-completed';
            if (status === 'CANCELLED') return 'status-cancelled';
            return 'status-requested';
        }

        function escapeHtml(value) {
            if (!value) return '';
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.getElementById('searchInput').addEventListener('input', applyFilter);
        loadPatientsByDoctor();

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }
    </script>
</body>

</html>
