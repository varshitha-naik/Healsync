<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - HealSync Admin</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Admin Appointments â€” follows clinical design system v1 */ -->
    <div class="app-shell">
        <th:block th:replace="fragments/admin-header :: adminHeader"></th:block>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Admin / Appointments</p>
                    <h1>Appointments</h1>
                </div>
                <div class="topbar-actions">
                    <button class="avatar-button" type="button"><span class="avatar-circle">AD</span></button>
                </div>
            </header>

            <main class="page-content">
                <div class="page-stack">
                    <section class="card">
                        <div class="section-header">
                            <div>
                                <h2>Filter appointments</h2>
                                <p class="section-copy">Review bookings by status and date window.</p>
                            </div>
                        </div>
                        <div class="filter-grid">
                            <div class="field">
                                <label>Status</label>
                                <select id="filterStatus" onchange="loadAppointments()">
                                    <option value="">All statuses</option>
                                    <option value="REQUESTED">Requested</option>
                                    <option value="CONFIRMED">Confirmed</option>
                                    <option value="COMPLETED">Completed</option>
                                    <option value="CANCELLED">Cancelled</option>
                                </select>
                            </div>
                            <div class="field">
                                <label>From date</label>
                                <input type="date" id="filterFromDate" onchange="loadAppointments()">
                            </div>
                            <div class="field">
                                <label>To date</label>
                                <input type="date" id="filterToDate" onchange="loadAppointments()">
                            </div>
                        </div>
                    </section>

                    <div id="loadingState" class="card loading-block">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                    </div>

                    <div id="appointmentsTable" style="display: none;">
                        <section class="table-card">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Patient</th>
                                        <th>Doctor</th>
                                        <th>Date & time</th>
                                        <th>Status</th>
                                        <th>Reason</th>
                                    </tr>
                                </thead>
                                <tbody id="appointmentsBody"></tbody>
                            </table>
                        </section>
                    </div>

                    <div id="emptyState" class="empty-state" style="display: none;">
                        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16"/></svg>
                        <p>No appointments found.</p>
                        <a href="/admin/dashboard" class="btn-primary">Return to dashboard</a>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwtToken');
        const userEmail = localStorage.getItem('userEmail');
        const userRole = localStorage.getItem('userRole');

        if (!token || userRole !== 'ADMIN') {
            window.location.href = '/login';
        }

        document.getElementById('userEmail').textContent = userEmail || 'Admin';

        const allAppointments = [
            { id: 1, patientName: 'John Doe', doctorName: 'Dr. Sarah Smith', startsAt: '2026-01-25T10:00:00', status: 'CONFIRMED', reason: 'Regular checkup' },
            { id: 2, patientName: 'Jane Wilson', doctorName: 'Dr. Michael Johnson', startsAt: '2026-01-25T14:30:00', status: 'REQUESTED', reason: 'Follow-up consultation' },
            { id: 3, patientName: 'Bob Smith', doctorName: 'Dr. Sarah Smith', startsAt: '2026-01-26T11:00:00', status: 'COMPLETED', reason: 'Annual physical' },
            { id: 4, patientName: 'Ava Clark', doctorName: 'Dr. Emma Jones', startsAt: '2026-01-27T09:15:00', status: 'CANCELLED', reason: 'Dermatology review' }
        ];

        async function loadAppointments() {
            document.getElementById('loadingState').style.display = 'grid';
            document.getElementById('appointmentsTable').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';

            setTimeout(() => {
                const filteredAppointments = filterAppointments(allAppointments);
                renderAppointments(filteredAppointments);
                document.getElementById('loadingState').style.display = 'none';
            }, 0);
        }

        function filterAppointments(appointments) {
            const statusFilterValue = (document.getElementById('filterStatus').value || '').trim().toLowerCase();
            const fromDateValue = document.getElementById('filterFromDate').value;
            const toDateValue = document.getElementById('filterToDate').value;

            const fromDate = fromDateValue ? new Date(`${fromDateValue}T00:00:00`) : null;
            const toDate = toDateValue ? new Date(`${toDateValue}T23:59:59`) : null;

            return appointments.filter(apt => {
                const appointmentDate = new Date(apt.startsAt);
                const appointmentStatus = (apt.status || '').trim().toLowerCase();

                const matchesStatus = !statusFilterValue || appointmentStatus === statusFilterValue;
                const matchesFromDate = !fromDate || appointmentDate >= fromDate;
                const matchesToDate = !toDate || appointmentDate <= toDate;

                return matchesStatus && matchesFromDate && matchesToDate;
            });
        }

        function renderAppointments(appointments) {
            const tbody = document.getElementById('appointmentsBody');
            tbody.innerHTML = '';

            if (appointments.length === 0) {
                document.getElementById('appointmentsTable').style.display = 'none';
                document.getElementById('emptyState').style.display = 'grid';
                return;
            }

            appointments.forEach(apt => {
                const statusClass = apt.status === 'REQUESTED' ? 'status-requested' : `status-${apt.status.toLowerCase()}`;
                const appointmentDate = new Date(apt.startsAt);
                tbody.innerHTML += `
                    <tr>
                        <td>#${apt.id}</td>
                        <td>${apt.patientName}</td>
                        <td>${apt.doctorName}</td>
                        <td>${appointmentDate.toLocaleString()}</td>
                        <td><span class="status-badge ${statusClass}">${apt.status}</span></td>
                        <td>${apt.reason}</td>
                    </tr>
                `;
            });

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('appointmentsTable').style.display = 'block';
        }

        loadAppointments();
    </script>
</body>

</html>
