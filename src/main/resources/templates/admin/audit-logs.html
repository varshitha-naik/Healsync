<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - HealSync Admin</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Audit Logs â€” follows clinical design system v1 */ -->
    <div class="app-shell">
        <th:block th:replace="fragments/admin-header :: adminHeader"></th:block>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Admin / Reports</p>
                    <h1>Audit logs</h1>
                </div>
            </header>
            <main class="page-content">
                <div class="page-stack">
                    <section class="card">
                        <div class="filter-grid">
                            <div class="field">
                                <label>Action type</label>
                                <select id="filterAction" onchange="loadLogs()">
                                    <option value="">All actions</option>
                                    <option value="LOGIN">Login</option>
                                    <option value="CREATE">Create</option>
                                    <option value="UPDATE">Update</option>
                                    <option value="DELETE">Delete</option>
                                </select>
                            </div>
                            <div class="field">
                                <label>Entity type</label>
                                <select id="filterEntity" onchange="loadLogs()">
                                    <option value="">All entities</option>
                                    <option value="User">User</option>
                                    <option value="Doctor">Doctor</option>
                                    <option value="Appointment">Appointment</option>
                                    <option value="Report">Report</option>
                                </select>
                            </div>
                            <div class="field">
                                <label>From date</label>
                                <input type="date" id="filterFromDate" onchange="loadLogs()">
                            </div>
                        </div>
                    </section>

                    <div id="loadingState" class="card loading-block">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                    </div>

                    <div id="logsTable" style="display: none;">
                        <section class="table-card">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Timestamp</th>
                                        <th>User</th>
                                        <th>Action</th>
                                        <th>Entity</th>
                                        <th>Entity ID</th>
                                        <th>IP address</th>
                                    </tr>
                                </thead>
                                <tbody id="logsBody"></tbody>
                            </table>
                        </section>
                    </div>

                    <div id="emptyState" class="empty-state" style="display: none;">
                        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16"/></svg>
                        <p>No audit logs found for the selected filters.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwtToken');
        const userEmail = localStorage.getItem('userEmail');
        const userRole = localStorage.getItem('userRole');

        if (!token || userRole !== 'ADMIN') {
            window.location.href = '/login';
        }

        document.getElementById('userEmail').textContent = userEmail || 'Admin';

        const allLogs = [
            { timestamp: '2026-01-24T12:05:30', user: 'admin@healsync.com', action: 'LOGIN', entityType: 'User', entityId: 1, ipAddress: '192.168.1.100' },
            { timestamp: '2026-01-24T11:30:15', user: 'dr.smith@healsync.com', action: 'CREATE', entityType: 'Report', entityId: 5, ipAddress: '192.168.1.102' },
            { timestamp: '2026-01-24T10:45:20', user: 'admin@healsync.com', action: 'UPDATE', entityType: 'Appointment', entityId: 12, ipAddress: '192.168.1.100' },
            { timestamp: '2026-01-24T09:15:00', user: 'patient.john@example.com', action: 'CREATE', entityType: 'Appointment', entityId: 15, ipAddress: '192.168.1.105' },
            { timestamp: '2026-01-24T08:30:45', user: 'admin@healsync.com', action: 'DELETE', entityType: 'Doctor', entityId: 3, ipAddress: '192.168.1.100' }
        ];

        async function loadLogs() {
            document.getElementById('loadingState').style.display = 'grid';
            document.getElementById('logsTable').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';

            setTimeout(() => {
                const filteredLogs = filterLogs(allLogs);
                renderLogs(filteredLogs);
                document.getElementById('loadingState').style.display = 'none';
            }, 0);
        }

        function filterLogs(logs) {
            const actionFilterValue = (document.getElementById('filterAction').value || '').trim().toLowerCase();
            const entityFilterValue = (document.getElementById('filterEntity').value || '').trim().toLowerCase();
            const fromDateValue = document.getElementById('filterFromDate').value;
            const fromDate = fromDateValue ? new Date(`${fromDateValue}T00:00:00`) : null;

            return logs.filter(log => {
                const actionValue = (log.action || '').trim().toLowerCase();
                const entityValue = (log.entityType || '').trim().toLowerCase();
                const logDate = new Date(log.timestamp);

                const matchesAction = !actionFilterValue || actionValue === actionFilterValue;
                const matchesEntity = !entityFilterValue || entityValue === entityFilterValue;
                const matchesFromDate = !fromDate || logDate >= fromDate;

                return matchesAction && matchesEntity && matchesFromDate;
            });
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('logsBody');
            tbody.innerHTML = '';

            if (logs.length === 0) {
                document.getElementById('logsTable').style.display = 'none';
                document.getElementById('emptyState').style.display = 'grid';
                return;
            }

            logs.forEach(log => {
                const logDate = new Date(log.timestamp);
                tbody.innerHTML += `
                    <tr>
                        <td>${logDate.toLocaleString()}</td>
                        <td>${log.user}</td>
                        <td><span class="status-badge status-${log.action.toLowerCase()}">${log.action}</span></td>
                        <td>${log.entityType}</td>
                        <td>#${log.entityId}</td>
                        <td>${log.ipAddress}</td>
                    </tr>
                `;
            });

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('logsTable').style.display = 'block';
        }

        loadLogs();
    </script>
</body>

</html>
