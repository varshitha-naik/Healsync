<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body class="auth-page">
    <!-- /* Redesigned: Register â€” follows clinical design system v1 */ -->
    <section class="auth-card">
        <div class="auth-header">
            <div class="brand-copy">
                <div class="brand-mark">HS</div>
                <h1 class="auth-title">Create your patient account</h1>
                <p class="auth-subtitle">A calm, secure way to manage appointments and records.</p>
            </div>
        </div>

        <div id="message"></div>

        <form id="registerForm" class="page-stack">
            <div class="field">
                <label for="fullName">Full name</label>
                <input type="text" class="input" id="fullName" name="fullName" required placeholder="John Doe">
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input type="email" class="input" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" class="input" id="password" name="password" required minlength="6"
                    placeholder="Minimum 6 characters">
            </div>

            <div class="form-grid">
                <div class="field">
                    <label for="dob">Date of birth</label>
                    <input type="date" class="input" id="dob" name="dob" required>
                </div>

                <div class="field">
                    <label for="gender">Gender</label>
                    <select class="select" id="gender" name="gender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label for="phone">Phone number</label>
                <input type="tel" class="input" id="phone" name="phone" required placeholder="+1 555 0123">
            </div>

            <button type="submit" class="btn-primary btn-block">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already registered? <a href="/login">Sign in</a></p>
        </div>

        <section class="card" style="margin-top: 24px;">
            <h2>Account setup note</h2>
            <p class="section-copy">New self-service registrations are created as patient accounts by default.</p>
        </section>
    </section>

    <script>
        const existingToken = localStorage.getItem('jwtToken');
        const existingRole = localStorage.getItem('userRole');
        const currentPath = window.location.pathname;

        if (existingToken && existingRole && (currentPath === '/login' || currentPath === '/') && currentPath !== '/appointments') {
            switch (existingRole) {
                case 'ADMIN':
                    window.location.href = '/admin/dashboard';
                    break;
                case 'DOCTOR':
                    window.location.href = '/doctor/dashboard';
                    break;
                case 'PATIENT':
                    window.location.href = '/patient/dashboard';
                    break;
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new URLSearchParams();
            formData.append('email', document.getElementById('email').value);
            formData.append('password', document.getElementById('password').value);
            formData.append('fullName', document.getElementById('fullName').value);
            formData.append('dob', document.getElementById('dob').value);
            formData.append('gender', document.getElementById('gender').value);
            formData.append('phone', document.getElementById('phone').value);

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('message').innerHTML = `
                        <div class="alert alert-success">
                            Account created successfully.<br>
                            <strong>Email:</strong> ${data.email}<br>
                            <strong>Role:</strong> ${data.role}<br><br>
                            Redirecting to login...
                        </div>
                    `;

                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    const error = await response.text();
                    document.getElementById('message').innerHTML = `
                        <div class="alert alert-danger">
                            Registration failed: ${error || 'Please try again'}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Registration error:', error);
                document.getElementById('message').innerHTML = `
                    <div class="alert alert-danger">
                        An error occurred. Please try again.
                    </div>
                `;
            }
        });
    </script>
</body>

</html>
