<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Profile â€” follows clinical design system v1 */ -->
    <div class="app-shell">
        <div th:replace="fragments/patient-header :: header"></div>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Patient / Profile</p>
                    <h1>Profile</h1>
                </div>
            </header>

            <main class="page-content">
                <section class="card">
                    <div class="profile-hero">
                        <div class="avatar-circle large">PT</div>
                        <div class="text-center">
                            <h2 class="user-name" id="displayFullName">Loading...</h2>
                            <span class="role-badge" id="displayRole">USER</span>
                        </div>
                    </div>

                    <form id="profileForm" class="form-grid">
                        <div class="field">
                            <label>Full name</label>
                            <input type="text" id="fullName" value="">
                        </div>
                        <div class="field">
                            <label>Email address</label>
                            <input type="email" id="email" value="" readonly>
                        </div>
                        <div class="field">
                            <label>Phone number</label>
                            <input type="tel" id="phone" value="">
                        </div>
                        <div class="field">
                            <label>Date of birth</label>
                            <input type="date" id="dob" value="">
                        </div>
                        <div class="field full">
                            <button type="submit" class="btn-primary">Save Changes</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwtToken');
        if (!token) window.location.href = '/login';

        const email = localStorage.getItem('userEmail');
        const role = localStorage.getItem('userRole');

        document.getElementById('email').value = email || '';
        document.getElementById('displayRole').textContent = role || 'USER';
        document.getElementById('displayFullName').textContent = 'John Doe';
        document.getElementById('fullName').value = 'John Doe';
        document.getElementById('phone').value = '123-456-7890';
        document.getElementById('dob').value = '1990-01-01';

        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Profile updated successfully!');
        });
    </script>
</body>

</html>
