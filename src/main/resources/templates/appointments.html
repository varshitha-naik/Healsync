<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Appointments â€” follows clinical design system v1 */ -->
    <div class="app-shell">
        <div th:replace="fragments/patient-header :: header"></div>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Patient / My Appointments</p>
                    <h1>Appointments</h1>
                </div>
            </header>
            <main class="page-content">
                <section class="card">
                    <h2>Appointment workspace</h2>
                    <p class="section-copy">Use the patient portal appointment view for booking and managing upcoming visits.</p>
                    <div class="horizontal-actions" style="margin-top: 16px;">
                        <a href="/patient/appointments" class="btn-primary">Open Patient Appointments</a>
                        <a href="/patient/find-doctor" class="btn-secondary">Find a Doctor</a>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>

</html>
