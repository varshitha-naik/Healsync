<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body class="auth-page">
    <!-- /* Redesigned: Forgot Password â€” follows clinical design system v1 */ -->
    <section class="auth-card compact">
        <div class="auth-header">
            <div class="brand-copy">
                <div class="brand-mark">HS</div>
                <h1 class="auth-title">Reset your password</h1>
                <p class="auth-subtitle">Enter your account email and weâ€™ll send reset instructions.</p>
            </div>
        </div>

        <form id="forgotPasswordForm" class="page-stack">
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" class="input" id="email" required placeholder="you@example.com">
            </div>

            <button type="submit" class="btn-primary btn-block">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            <a href="/login">Back to login</a>
        </div>
    </section>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            alert(`If an account exists for ${email}, a password reset link has been sent.`);
        });
    </script>
</body>

</html>
