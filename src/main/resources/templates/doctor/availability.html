<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Availability - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Doctor Availability â€” follows clinical design system v1 */ -->
    <div class="app-shell">
        <div th:replace="fragments/doctor-navbar :: navbar"></div>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Doctor / Availability</p>
                    <h1>Availability</h1>
                </div>
            </header>

            <main class="page-content">
                <div class="page-columns">
                    <section class="card">
                        <div class="section-header">
                            <div>
                                <h2>Add availability</h2>
                                <p class="section-copy">Set weekly sessions for patient booking.</p>
                            </div>
                        </div>
                        <form id="addForm" onsubmit="addAvailability(event)" class="page-stack">
                            <div class="field">
                                <label>Select days</label>
                                <div class="inline-checkboxes">
                                    <label><input type="checkbox" name="day" value="MONDAY"> Mon</label>
                                    <label><input type="checkbox" name="day" value="TUESDAY"> Tue</label>
                                    <label><input type="checkbox" name="day" value="WEDNESDAY"> Wed</label>
                                    <label><input type="checkbox" name="day" value="THURSDAY"> Thu</label>
                                    <label><input type="checkbox" name="day" value="FRIDAY"> Fri</label>
                                    <label><input type="checkbox" name="day" value="SATURDAY"> Sat</label>
                                    <label><input type="checkbox" name="day" value="SUNDAY"> Sun</label>
                                </div>
                            </div>
                            <div class="form-grid">
                                <div class="field">
                                    <label>Start time</label>
                                    <input type="time" id="startTime" required>
                                </div>
                                <div class="field">
                                    <label>End time</label>
                                    <input type="time" id="endTime" required>
                                </div>
                            </div>
                            <button type="submit" class="btn-primary">Add Slot</button>
                        </form>
                    </section>

                    <section class="table-card">
                        <div class="section-header" style="padding: 20px 24px 0;">
                            <div>
                                <h2>Current schedule</h2>
                                <p class="section-copy">Existing weekly slots available for booking.</p>
                            </div>
                        </div>
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Day</th>
                                    <th>From</th>
                                    <th>To</th>
                                    <th class="actions-cell">Action</th>
                                </tr>
                            </thead>
                            <tbody id="slotsBody">
                                <tr><td colspan="4">Loading...</td></tr>
                            </tbody>
                        </table>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <div id="confirmModal" class="modal hidden">
        <div class="modal-content">
            <h2>Confirm action</h2>
            <p id="confirmText">Are you sure?</p>
            <div class="modal-actions">
                <button id="confirmNo" class="btn-secondary">Cancel</button>
                <button id="confirmYes" class="btn-destructive">Remove</button>
            </div>
        </div>
    </div>

    <script th:inline="none">
        const API_BASE = '/api/doctor';
        let currentUserId = null;

        async function init() {
            const token = localStorage.getItem('jwtToken');
            if (!token) window.location.href = '/login';

            try {
                const meRes = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
                const user = await meRes.json();
                currentUserId = user.userId;
                loadSlots();
            } catch (e) {
                console.error(e);
            }
        }

        async function loadSlots() {
            const token = localStorage.getItem('jwtToken');
            const res = await fetch(`${API_BASE}/availability/${currentUserId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const slots = await res.json();

            const tbody = document.getElementById('slotsBody');
            tbody.innerHTML = '';

            if (slots.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">No slots added.</td></tr>';
                return;
            }

            const days = { MONDAY: 1, TUESDAY: 2, WEDNESDAY: 3, THURSDAY: 4, FRIDAY: 5, SATURDAY: 6, SUNDAY: 7 };
            slots.sort((a, b) => days[a.dayOfWeek] - days[b.dayOfWeek] || a.startTime.localeCompare(b.startTime));

            slots.forEach(s => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${s.dayOfWeek}</td>
                    <td>${s.startTime}</td>
                    <td>${s.endTime}</td>
                    <td class="actions-cell"><button class="btn-destructive" onclick="deleteSlot(${s.id})">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function addAvailability(e) {
            e.preventDefault();
            const token = localStorage.getItem('jwtToken');
            const sTime = document.getElementById('startTime').value;
            const eTime = document.getElementById('endTime').value;

            if (sTime >= eTime) {
                alert("Start time must be before End time");
                return;
            }

            const selectedDays = [...document.querySelectorAll('input[name=day]:checked')].map(c => c.value);
            if (selectedDays.length === 0) {
                alert("Please select at least one day");
                return;
            }

            const payload = { doctorId: currentUserId, days: selectedDays, startTime: sTime + ":00", endTime: eTime + ":00" };

            try {
                const res = await fetch(`${API_BASE}/availability`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    loadSlots();
                    document.querySelectorAll('input[type=checkbox]').forEach(c => c.checked = false);
                } else {
                    const txt = await res.text();
                    alert("Failed to add slot: " + txt);
                }
            } catch (err) {
                console.error(err);
                alert("Error connecting to server");
            }
        }

        function showConfirm(message) {
            return new Promise(resolve => {
                const modal = document.getElementById('confirmModal');
                const text = document.getElementById('confirmText');
                const yes = document.getElementById('confirmYes');
                const no = document.getElementById('confirmNo');

                text.innerText = message;
                modal.classList.remove('hidden');

                yes.onclick = () => { modal.classList.add('hidden'); resolve(true); };
                no.onclick = () => { modal.classList.add('hidden'); resolve(false); };
            });
        }

        async function deleteSlot(id) {
            if (!(await showConfirm("Remove this availability slot?"))) return;
            const token = localStorage.getItem('jwtToken');
            await fetch(`${API_BASE}/availability/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadSlots();
        }

        window.onload = init;
    </script>
</body>

</html>
