<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointments - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Doctor Appointments â€” follows clinical design system v1 */ -->
    <div class="app-shell">
        <div th:replace="fragments/doctor-navbar :: navbar"></div>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Doctor / My Schedule</p>
                    <h1>Appointments</h1>
                </div>
            </header>

            <main class="page-content">
                <div class="page-stack">
                    <section class="stats-grid">
                        <article class="metric-card"><span class="metric-label">Total</span><span class="metric-value" id="countTotal">0</span></article>
                        <article class="metric-card"><span class="metric-label">Requested</span><span class="metric-value" id="countRequested">0</span></article>
                        <article class="metric-card"><span class="metric-label">Confirmed</span><span class="metric-value" id="countConfirmed">0</span></article>
                        <article class="metric-card"><span class="metric-label">Completed</span><span class="metric-value" id="countCompleted">0</span></article>
                    </section>

                    <section class="card">
                        <div class="section-header">
                            <div>
                                <h2>Book appointment</h2>
                                <p class="section-copy">Create a new appointment directly from your schedule.</p>
                            </div>
                        </div>
                        <form id="bookingForm" onsubmit="bookAppointment(event)" class="form-grid">
                            <input type="hidden" id="doctorId">
                            <input type="hidden" id="patientId">
                            <div class="field full">
                                <label>Reason</label>
                                <input type="text" id="reason">
                            </div>
                            <div class="field">
                                <label>Start time</label>
                                <input type="datetime-local" id="start" required>
                            </div>
                            <div class="field">
                                <label>End time</label>
                                <input type="datetime-local" id="end" required>
                            </div>
                            <div class="field full">
                                <button type="submit" id="bookBtn" class="btn-primary">Book Appointment</button>
                            </div>
                        </form>
                    </section>

                    <section class="card">
                        <div class="filter-grid">
                            <div class="field">
                                <label>Status filter</label>
                                <select id="statusFilter" onchange="loadAppointments()">
                                    <option value="">All statuses</option>
                                    <option value="REQUESTED">Requested</option>
                                    <option value="CONFIRMED">Confirmed</option>
                                    <option value="CANCELLED">Cancelled</option>
                                    <option value="COMPLETED">Completed</option>
                                </select>
                            </div>
                            <div class="field" style="align-content: end;">
                                <button class="btn-secondary" type="button" onclick="loadConfirmedOnly()">Show Confirmed Only</button>
                            </div>
                        </div>
                    </section>

                    <div id="loadingIndicator" class="card loading-block">Loading appointments...</div>
                    <div id="errorMessage" class="alert alert-danger" style="display:none;"></div>

                    <section class="page-columns">
                        <section class="card">
                            <div class="section-header"><div><h2>Upcoming appointments</h2></div></div>
                            <div id="upcomingList" class="appointment-history"></div>
                        </section>
                        <section class="card">
                            <div class="section-header"><div><h2>Past appointments</h2></div></div>
                            <div id="pastList" class="appointment-history"></div>
                        </section>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <div id="confirmModal" class="modal hidden">
        <div class="modal-content">
            <p id="confirmText"></p>
            <div class="modal-actions">
                <button id="confirmNo" class="btn-secondary">Cancel</button>
                <button id="confirmYes" class="btn-primary">Confirm</button>
            </div>
        </div>
    </div>

    <div id="cancellationModal" class="modal hidden">
        <div class="modal-content">
            <h2>Cancel appointment</h2>
            <div class="field">
                <label for="cancellationReason">Reason for cancellation</label>
                <textarea id="cancellationReason" rows="4" placeholder="Please provide a reason"></textarea>
                <p id="cancellationError" class="error-text" style="display:none;"></p>
            </div>
            <div class="modal-actions">
                <button onclick="closeCancellationModal()" class="btn-secondary">Cancel</button>
                <button onclick="submitCancellation()" class="btn-destructive">Confirm Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/appointments';

        function getAuthHeaders() {
            const token = localStorage.getItem('jwtToken');
            if (!token) return {};
            return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
        }

        function showSuccess(msg) {
            const el = document.getElementById('errorMessage');
            el.className = 'alert alert-success';
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.className = 'alert alert-danger';
            el.innerText = msg;
            el.style.display = 'block';
        }

        async function bookAppointment(event) {
            event.preventDefault();
            const btn = document.getElementById('bookBtn');
            const startVal = document.getElementById('start').value;
            const endVal = document.getElementById('end').value;
            if (new Date(startVal) >= new Date(endVal)) {
                showError("Start time must be before end time");
                return;
            }

            const doctorIdInput = document.getElementById('doctorId').value;
            const doctorId = doctorIdInput ? Number(doctorIdInput) : 1;
            const patientId = document.getElementById('patientId').value;
            const payload = { clinicId: 1, doctorId: doctorId, patientId: Number(patientId), start: startVal + ":00", end: endVal + ":00", reason: document.getElementById('reason').value };

            try {
                btn.disabled = true;
                btn.textContent = "Creating appointment...";
                const response = await fetch(`${API_BASE}/book`, { method: "POST", headers: getAuthHeaders(), body: JSON.stringify(payload) });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.message || "Booking failed");
                }
                showSuccess("Appointment booked successfully");
                document.getElementById("bookingForm").reset();
                await loadAppointments();
            } catch (error) {
                console.error(error);
                showError(error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "Book Appointment";
            }
        }

        async function loadAppointments() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const errorMessage = document.getElementById('errorMessage');
            const statusFilter = document.getElementById('statusFilter').value;
            loadingIndicator.style.display = 'grid';
            document.getElementById('upcomingList').innerHTML = '';
            document.getElementById('pastList').innerHTML = '';

            try {
                const meResponse = await fetch('/api/auth/me', { method: 'GET', headers: getAuthHeaders() });
                if (!meResponse.ok) throw new Error('Failed to fetch user info. Please login again.');
                const user = await meResponse.json();

                const dInput = document.getElementById('doctorId');
                if (dInput) { dInput.value = user.userId; dInput.disabled = true; }

                let url = `${API_BASE}/doctor/${user.userId}`;
                if (statusFilter) url += `?status=${statusFilter}`;

                const response = await fetch(url, { method: 'GET', headers: getAuthHeaders() });
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || 'Failed to load appointments');
                }

                const appointments = await response.json();
                updateSummary(appointments);
                renderAppointments(appointments);
                errorMessage.style.display = 'none';
            } catch (error) {
                errorMessage.innerText = error.message;
                errorMessage.style.display = 'block';
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        function updateSummary(appointments) {
            const counts = { total: appointments.length, requested: 0, confirmed: 0, cancelled: 0, completed: 0 };
            appointments.forEach(app => {
                if (app.status === 'REQUESTED') counts.requested++;
                else if (app.status === 'CONFIRMED') counts.confirmed++;
                else if (app.status === 'CANCELLED') counts.cancelled++;
                else if (app.status === 'COMPLETED') counts.completed++;
            });
            document.getElementById('countTotal').innerText = counts.total;
            document.getElementById('countRequested').innerText = counts.requested;
            document.getElementById('countConfirmed').innerText = counts.confirmed;
            document.getElementById('countCompleted').innerText = counts.completed;
        }

        function renderAppointments(appointments) {
            const upcomingContainer = document.getElementById('upcomingList');
            const pastContainer = document.getElementById('pastList');
            const now = new Date();

            const renderList = (list, container, emptyMsg) => {
                container.innerHTML = '';
                if (list.length === 0) {
                    container.innerHTML = `<div class="empty-state"><p>${emptyMsg}</p></div>`;
                    return;
                }

                list.forEach(app => {
                    const startStr = app.startDateTime ? new Date(app.startDateTime).toLocaleString() : 'N/A';
                    const endStr = app.endDateTime ? new Date(app.endDateTime).toLocaleString() : 'N/A';
                    let actionsHtml = '';
                    if (app.status === 'REQUESTED') actionsHtml += `<button class="btn-primary" onclick="confirmAppointment(${app.id})">Confirm</button>`;
                    else if (app.status === 'CONFIRMED') actionsHtml += `<button class="btn-secondary" onclick="completeAppointment(${app.id})">Complete</button>`;
                    if (app.status !== 'CANCELLED' && app.status !== 'COMPLETED') actionsHtml += `<button class="btn-destructive" onclick="cancelAppointment(${app.id})">Cancel</button>`;

                    const card = document.createElement('article');
                    card.className = 'history-card';
                    card.innerHTML = `<div class="section-header" style="margin-bottom: 8px;"><h3>${app.patientName || app.patientId}</h3><span class="status-badge ${app.status === 'REQUESTED' ? 'status-requested' : 'status-' + app.status.toLowerCase()}">${app.status}</span></div><p>${app.reason || 'N/A'}</p><p>${startStr} - ${endStr}</p>${app.status === 'CANCELLED' && app.cancellationReason ? `<p class="text-danger">${app.cancellationReason}</p>` : ''}<div class="field"><label>Doctor notes</label><textarea id="notes-${app.id}">${app.doctorNotes || ''}</textarea><button class="btn-secondary" onclick="saveNotes(${app.id})">Save Notes</button></div><div class="horizontal-actions" style="margin-top: 12px;">${actionsHtml}</div>`;
                    container.appendChild(card);
                });
            };

            renderList(appointments.filter(app => new Date(app.startDateTime) >= now), upcomingContainer, "No upcoming appointments yet.");
            renderList(appointments.filter(app => new Date(app.startDateTime) < now), pastContainer, "No past appointments found.");
        }

        async function confirmAppointment(id) {
            if (!(await showConfirm('Are you sure you want to confirm this appointment?'))) return;
            try {
                const response = await fetch(`${API_BASE}/${id}/status`, { method: 'PUT', headers: getAuthHeaders(), body: JSON.stringify({ status: 'CONFIRMED' }) });
                if (!response.ok) throw new Error('Failed to confirm appointment');
                showSuccess('Appointment confirmed successfully');
                loadAppointments();
            } catch (error) { showError(error.message); }
        }

        let appointmentToCancel = null;
        function openCancellationModal(id) {
            appointmentToCancel = id;
            document.getElementById('cancellationModal').classList.remove('hidden');
            document.getElementById('cancellationReason').value = '';
            document.getElementById('cancellationError').style.display = 'none';
        }
        function closeCancellationModal() {
            document.getElementById('cancellationModal').classList.add('hidden');
            appointmentToCancel = null;
        }
        async function submitCancellation() {
            if (!appointmentToCancel) return;
            const reason = document.getElementById('cancellationReason').value;
            if (!reason.trim()) {
                const err = document.getElementById('cancellationError');
                err.innerText = "Please provide a reason.";
                err.style.display = 'block';
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/${appointmentToCancel}/cancel`, { method: 'PUT', headers: getAuthHeaders(), body: JSON.stringify({ reason: reason }) });
                if (!response.ok) throw new Error('Failed to cancel appointment');
                showSuccess("Appointment cancelled successfully");
                closeCancellationModal();
                loadAppointments();
            } catch (error) {
                const err = document.getElementById('cancellationError');
                err.innerText = error.message;
                err.style.display = 'block';
            }
        }
        function cancelAppointment(id) { openCancellationModal(id); }

        async function saveNotes(id) {
            const notes = document.getElementById(`notes-${id}`).value;
            if (!notes) { showError("Notes cannot be empty"); return; }
            try {
                const response = await fetch(`${API_BASE}/${id}/notes`, { method: 'PUT', headers: getAuthHeaders(), body: JSON.stringify({ doctorNotes: notes }) });
                if (!response.ok) throw new Error('Failed to save notes');
                showSuccess('Notes updated!');
                loadAppointments();
            } catch (error) { showError(error.message); }
        }

        async function completeAppointment(id) {
            if (!(await showConfirm("Mark appointment as completed?"))) return;
            try {
                const response = await fetch(`${API_BASE}/${id}/status`, { method: 'PUT', headers: getAuthHeaders(), body: JSON.stringify({ status: 'COMPLETED' }) });
                if (!response.ok) throw new Error('Failed to complete appointment');
                showSuccess("Appointment completed");
                loadAppointments();
            } catch (error) { showError(error.message); }
        }

        async function loadConfirmedOnly() {
            try {
                const meResponse = await fetch('/api/auth/me', { method: 'GET', headers: getAuthHeaders() });
                if (!meResponse.ok) throw new Error("Failed to check user role");
                const user = await meResponse.json();
                const response = await fetch(`${API_BASE}/doctor/${user.userId}?status=CONFIRMED`, { method: 'GET', headers: getAuthHeaders() });
                if (!response.ok) throw new Error("Failed to load confirmed appointments");
                const appointments = await response.json();
                updateSummary(appointments);
                renderAppointments(appointments);
                showSuccess(`Showing ${appointments.length} CONFIRMED appointments`);
            } catch (error) { showError(error.message); }
        }

        function showConfirm(message) {
            return new Promise((resolve) => {
                const modal = document.getElementById("confirmModal");
                document.getElementById("confirmText").innerText = message;
                modal.classList.remove("hidden");
                document.getElementById("confirmYes").onclick = () => { modal.classList.add("hidden"); resolve(true); };
                document.getElementById("confirmNo").onclick = () => { modal.classList.add("hidden"); resolve(false); };
            });
        }

        window.onload = loadAppointments;
    </script>
</body>

</html>
