<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Patients - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
    <style>
        .doctor-history-modal {
            width: min(900px, 96vw);
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }

        .doctor-history-header {
            padding: 20px 24px 12px;
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
        }

        .doctor-history-body {
            padding: 16px 24px;
            overflow: auto;
            min-height: 0;
            flex: 1;
        }

        .doctor-history-footer {
            padding: 12px 24px 20px;
            border-top: 1px solid var(--color-border);
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <!-- /* Redesigned: Doctor Patients - follows clinical design system v1 */ -->
    <div class="app-shell">
        <div th:replace="fragments/doctor-navbar :: navbar"></div>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Doctor / Patients</p>
                    <h1>Patient panel</h1>
                </div>
            </header>

            <main class="page-content">
                <section class="table-card">
                    <div class="section-header" style="padding: 20px 24px 0;">
                        <div>
                            <h2>Assigned patients</h2>
                            <p class="section-copy">Open a patient row to review appointment history.</p>
                        </div>
                    </div>
                    <div id="loading" class="loading-block" style="padding: 24px;">Loading patients...</div>
                    <table id="patientsTable" class="data-table" style="display:none;">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Last visit</th>
                                <th class="actions-cell">Action</th>
                            </tr>
                        </thead>
                        <tbody id="patientsBody"></tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>

    <div id="historyModal" class="modal is-hidden">
        <div class="modal-content doctor-history-modal">
            <div class="doctor-history-header"><h2 id="modalTitle">Appointment History</h2></div>
            <div id="historyList" class="history-list doctor-history-body"></div>
            <div class="modal-actions doctor-history-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script th:inline="none">
        const API_BASE = '/api/doctor';
        let currentDoctorUserId = null;

        async function loadPatients() {
            const token = localStorage.getItem('jwtToken');
            if (!token) window.location.href = '/login';

            try {
                const meRes = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
                const user = await meRes.json();
                currentDoctorUserId = user.userId;
                const res = await fetch(`${API_BASE}/${user.userId}/patients`, { headers: { 'Authorization': `Bearer ${token}` } });
                const patients = await res.json();

                const tbody = document.getElementById('patientsBody');
                tbody.innerHTML = '';

                if (patients.length === 0) {
                    document.getElementById('loading').innerText = "No patients found.";
                    return;
                }

                patients.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${p.patientName}</td>
                        <td>${p.email}</td>
                        <td>${p.lastVisitDate ? new Date(p.lastVisitDate).toLocaleDateString() : '-'}</td>
                        <td class="actions-cell"><button class="btn-secondary" type="button" onclick="showHistory(${p.patientId}, '${escapeHtml(p.patientName)}')">View History</button></td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('patientsTable').style.display = 'table';
            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerText = "Error loading patients.";
            }
        }

        async function showHistory(patientProfileId, name) {
            const token = localStorage.getItem('jwtToken');
            document.getElementById('modalTitle').innerText = `History: ${name}`;
            document.getElementById('historyList').innerHTML = 'Loading...';
            document.getElementById('historyModal').classList.remove('is-hidden');

            try {
                const res = await fetch(`/api/doctor/${currentDoctorUserId}/patient-history?patientProfileId=${patientProfileId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error("Could not fetch history");
                const payload = await res.json();
                const list = document.getElementById('historyList');
                list.innerHTML = '';

                const demographics = payload.patient || {};
                const pastAppointments = payload.pastAppointments || [];
                const completedAppointments = payload.completedAppointments || [];
                const prescriptions = payload.prescriptions || [];
                const reports = payload.reports || [];

                const demographicCard = document.createElement('div');
                demographicCard.className = 'history-card';
                demographicCard.innerHTML = `
                    <h3>Patient demographics</h3>
                    <p>Email: ${demographics.email || '-'}</p>
                    <p>DOB: ${demographics.dob || '-'}</p>
                    <p>Gender: ${demographics.gender || '-'}</p>
                    <p>Blood group: ${demographics.bloodGroup || '-'}</p>
                    <p>Phone: ${demographics.phone || '-'}</p>
                `;
                list.appendChild(demographicCard);

                const section = (title, itemsHtml) => {
                    const div = document.createElement('div');
                    div.className = 'history-card';
                    div.innerHTML = `<h3>${title}</h3>${itemsHtml}`;
                    list.appendChild(div);
                };

                section(
                    'Past appointments',
                    pastAppointments.length
                        ? pastAppointments.map(a => `<p>${formatAppointmentLine(a)} <span class="status-badge ${getStatusClass(a.status)}">${a.status}</span></p>`).join('')
                        : '<p>No past appointments found.</p>'
                );
                section(
                    'Completed appointments',
                    completedAppointments.length
                        ? completedAppointments.map(a => `<p>${formatAppointmentLine(a)}</p>`).join('')
                        : '<p>No completed appointments found.</p>'
                );
                section(
                    'Previous prescriptions',
                    prescriptions.length
                        ? prescriptions.map(p => `<p>Prescription #${p.id} (${new Date(p.createdAt).toLocaleDateString()}) - ${escapeHtml(p.notes || 'No notes')}</p>`).join('')
                        : '<p>No prescriptions found.</p>'
                );
                section(
                    'Previous medical reports',
                    reports.length
                        ? reports.map(r => `<p>${escapeHtml(r.title || 'Report')} (${new Date(r.createdAt).toLocaleDateString()})</p>`).join('')
                        : '<p>No reports found.</p>'
                );
            } catch (e) {
                document.getElementById('historyList').innerText = e.message;
            }
        }

        function formatAppointmentLine(appointment) {
            if (!appointment || !appointment.startDateTime) return 'Unknown appointment';
            const d = new Date(appointment.startDateTime);
            return `${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} - ${escapeHtml(appointment.reason || 'No reason')}`;
        }

        function getStatusClass(status) {
            if (status === 'CONFIRMED') return 'status-confirmed';
            if (status === 'CANCELLED') return 'status-cancelled';
            if (status === 'COMPLETED') return 'status-completed';
            return 'status-requested';
        }

        function closeModal() {
            document.getElementById('historyModal').classList.add('is-hidden');
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        window.onload = loadPatients;
    </script>
</body>

</html>
