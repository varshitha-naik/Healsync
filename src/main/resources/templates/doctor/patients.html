<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Patients - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Doctor Patients - follows clinical design system v1 */ -->
    <div class="app-shell">
        <div th:replace="fragments/doctor-navbar :: navbar"></div>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Doctor / Patients</p>
                    <h1>Patient panel</h1>
                </div>
            </header>

            <main class="page-content">
                <section class="table-card">
                    <div class="section-header" style="padding: 20px 24px 0;">
                        <div>
                            <h2>Assigned patients</h2>
                            <p class="section-copy">Open a patient row to review appointment history.</p>
                        </div>
                    </div>
                    <div id="loading" class="loading-block" style="padding: 24px;">Loading patients...</div>
                    <table id="patientsTable" class="data-table" style="display:none;">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Last visit</th>
                            </tr>
                        </thead>
                        <tbody id="patientsBody"></tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>

    <div id="historyModal" class="modal is-hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Appointment History</h2>
            <div id="historyList" class="history-list" style="margin-top: 16px;"></div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script th:inline="none">
        const API_BASE = '/api/doctor';

        async function loadPatients() {
            const token = localStorage.getItem('jwtToken');
            if (!token) window.location.href = '/login';

            try {
                const meRes = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
                const user = await meRes.json();
                const res = await fetch(`${API_BASE}/${user.userId}/patients`, { headers: { 'Authorization': `Bearer ${token}` } });
                const patients = await res.json();

                const tbody = document.getElementById('patientsBody');
                tbody.innerHTML = '';

                if (patients.length === 0) {
                    document.getElementById('loading').innerText = "No patients found.";
                    return;
                }

                patients.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.onclick = () => showHistory(p.patientId, p.patientName);
                    tr.innerHTML = `<td>${p.patientName}</td><td>${p.email}</td><td>${p.lastVisitDate ? new Date(p.lastVisitDate).toLocaleDateString() : '-'}</td>`;
                    tbody.appendChild(tr);
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('patientsTable').style.display = 'table';
            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerText = "Error loading patients.";
            }
        }

        async function showHistory(patientId, name) {
            const token = localStorage.getItem('jwtToken');
            document.getElementById('modalTitle').innerText = `History: ${name}`;
            document.getElementById('historyList').innerHTML = 'Loading...';
            document.getElementById('historyModal').classList.remove('is-hidden');

            try {
                const res = await fetch(`/api/appointments/patient/${patientId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) throw new Error("Could not fetch history");
                const apps = await res.json();
                const list = document.getElementById('historyList');
                list.innerHTML = '';

                if (apps.length === 0) {
                    list.innerHTML = '<p>No history found.</p>';
                    return;
                }

                apps.forEach(a => {
                    const div = document.createElement('div');
                    div.className = 'history-card';
                    div.innerHTML = `<h3>${new Date(a.startDateTime).toLocaleDateString()} ${new Date(a.startDateTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</h3><p>${a.reason || 'No reason specified'}</p><span class="status-badge ${getStatusClass(a.status)}">${a.status}</span>`;
                    list.appendChild(div);
                });
            } catch (e) {
                document.getElementById('historyList').innerText = e.message;
            }
        }

        function getStatusClass(status) {
            if (status === 'CONFIRMED') return 'status-confirmed';
            if (status === 'CANCELLED') return 'status-cancelled';
            if (status === 'COMPLETED') return 'status-completed';
            return 'status-requested';
        }

        function closeModal() {
            document.getElementById('historyModal').classList.add('is-hidden');
        }

        window.onload = loadPatients;
    </script>
</body>

</html>
