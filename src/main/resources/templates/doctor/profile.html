<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
    <style>
        .profile-photo-edit { display: none; width: 100%; max-width: 420px; }
        .profile-photo-edit.active { display: block; }
        .file-picker-input { display: none; }
        .file-helper { color: #64748b; font-size: 0.85rem; margin-top: 6px; }
        .sticky-profile-actions {
            position: sticky;
            bottom: 0;
            background: #fff;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            margin-top: 18px;
            z-index: 5;
        }
    </style>
</head>

<body>
    <!-- /* Redesigned: Doctor Profile - follows clinical design system v1 */ -->
    <div class="app-shell">
        <div th:replace="fragments/doctor-navbar :: navbar"></div>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Doctor / Profile</p>
                    <h1>Profile</h1>
                </div>
            </header>

            <main class="page-content">
                <section class="card">
                    <div id="profileMessage" class="alert alert-success" style="display:none;"></div>
                    <div class="profile-hero">
                        <img id="profileImg" src="/images/default-doctor.svg" alt="Doctor Profile" class="avatar-circle large" style="object-fit: cover;" onerror="handleDoctorImageError(this)">
                        <div class="text-center">
                            <h2 id="docName">Loading...</h2>
                            <p class="section-copy" id="docSpec">Loading...</p>
                        </div>
                        <div id="photoEditSection" class="profile-photo-edit">
                            <div class="field">
                                <label>Profile photo</label>
                                <div class="horizontal-actions" style="align-items:center;">
                                    <button type="button" class="btn-secondary" onclick="openPhotoPicker()">Change Photo</button>
                                    <span id="selectedPhotoName" class="helper-text">No file selected</span>
                                </div>
                                <input id="photoInput" class="file-picker-input" type="file" accept=".jpg,.jpeg,.png" onchange="handlePhotoSelected(event)">
                                <p class="file-helper">JPG or PNG, maximum 2 MB.</p>
                                <div id="uploadMessage" class="helper-text"></div>
                            </div>
                        </div>
                        <div class="horizontal-actions" id="topEditActions">
                            <button id="editProfileBtn" class="btn-secondary" type="button" onclick="enableEditMode()">Edit Profile</button>
                        </div>
                    </div>

                    <div class="details-grid">
                        <div class="detail-card">
                            <label>Name</label>
                            <span id="docNameDisplay">Loading...</span>
                            <input id="docNameInput" type="text" style="display:none;">
                        </div>
                        <div class="detail-card">
                            <label>Specialization</label>
                            <span id="docSpecDisplay">Loading...</span>
                            <input id="docSpecInput" type="text" style="display:none;">
                        </div>
                        <div class="detail-card">
                            <label>Email</label>
                            <span id="docEmail">Loading...</span>
                            <input id="docEmailInput" type="email" style="display:none;">
                        </div>
                        <div class="detail-card">
                            <label>License Number</label>
                            <span id="docLicense">Loading...</span>
                            <input id="docLicenseInput" type="text" style="display:none;">
                        </div>
                        <div class="detail-card">
                            <label>Experience</label>
                            <span id="docExp">Loading...</span>
                            <input id="docExpInput" type="number" min="0" style="display:none;">
                        </div>
                        <div class="detail-card"><label>Clinic ID</label><span id="docClinic">Loading...</span></div>
                    </div>
                    <div id="bottomEditActions" class="horizontal-actions sticky-profile-actions" style="display:none;">
                        <button id="saveProfileBtn" class="btn-primary" type="button" onclick="saveProfile()">Save</button>
                        <button id="cancelProfileBtn" class="btn-secondary" type="button" onclick="cancelEditMode()">Cancel</button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        let profileData = null;
        let isEditMode = false;
        let selectedPhotoFile = null;
        let selectedPhotoPreviewUrl = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadProfile();
        });

        const DEFAULT_DOCTOR_IMAGE = '/images/default-doctor.svg';

        async function loadProfile() {
            const token = localStorage.getItem('jwtToken');
            const doctorId = getUserIdFromToken(token);

            if (!token || !doctorId) {
                window.location.href = '/login';
                return;
            }

            try {
                const response = await fetch(`/api/doctor/${doctorId}/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Failed to load profile");

                const profile = await response.json();
                const email = localStorage.getItem('userEmail') || 'N/A';
                profileData = { ...profile, email: email };

                document.getElementById('docName').innerText = profile.fullName || 'N/A';
                document.getElementById('docSpec').innerText = profile.specialization || 'N/A';
                document.getElementById('docNameDisplay').innerText = profile.fullName || 'N/A';
                document.getElementById('docSpecDisplay').innerText = profile.specialization || 'N/A';
                document.getElementById('docEmail').innerText = email;
                document.getElementById('docLicense').innerText = profile.licenseNumber || 'N/A';
                document.getElementById('docExp').innerText = (profile.experienceYears ?? 0) + " Years";
                document.getElementById('docClinic').innerText = profile.clinicId;
                document.getElementById('profileImg').src = getDoctorPhotoUrl(profile.profilePhotoUrl);
                syncInputsFromProfile();
            } catch (error) {
                console.error(error);
                showProfileMessage("Error loading profile data.", "error");
            }
        }

        function getUserIdFromToken() {
            return localStorage.getItem('userId');
        }

        function getDoctorPhotoUrl(photoUrl) {
            if (!photoUrl || !photoUrl.trim()) return DEFAULT_DOCTOR_IMAGE;
            return photoUrl.trim();
        }

        function handleDoctorImageError(img) {
            if (img.dataset.fallbackApplied === 'true') return;
            img.dataset.fallbackApplied = 'true';
            img.src = DEFAULT_DOCTOR_IMAGE;
        }

        function enableEditMode() {
            isEditMode = true;
            toggleProfileEditUI(true);
        }

        function cancelEditMode() {
            isEditMode = false;
            syncInputsFromProfile();
            clearSelectedPhoto();
            document.getElementById('profileImg').src = getDoctorPhotoUrl(profileData?.profilePhotoUrl);
            toggleProfileEditUI(false);
            showProfileMessage("", "success");
        }

        function toggleProfileEditUI(editMode) {
            document.getElementById('editProfileBtn').style.display = editMode ? 'none' : 'inline-flex';
            document.getElementById('bottomEditActions').style.display = editMode ? 'flex' : 'none';
            document.getElementById('photoEditSection').classList.toggle('active', editMode);

            document.getElementById('docNameDisplay').style.display = editMode ? 'none' : 'inline';
            document.getElementById('docSpecDisplay').style.display = editMode ? 'none' : 'inline';
            document.getElementById('docEmail').style.display = editMode ? 'none' : 'inline';
            document.getElementById('docLicense').style.display = editMode ? 'none' : 'inline';
            document.getElementById('docExp').style.display = editMode ? 'none' : 'inline';

            document.getElementById('docNameInput').style.display = editMode ? 'block' : 'none';
            document.getElementById('docSpecInput').style.display = editMode ? 'block' : 'none';
            document.getElementById('docEmailInput').style.display = editMode ? 'block' : 'none';
            document.getElementById('docLicenseInput').style.display = editMode ? 'block' : 'none';
            document.getElementById('docExpInput').style.display = editMode ? 'block' : 'none';
        }

        function syncInputsFromProfile() {
            if (!profileData) return;
            document.getElementById('docNameInput').value = profileData.fullName || '';
            document.getElementById('docSpecInput').value = profileData.specialization || '';
            document.getElementById('docEmailInput').value = profileData.email || '';
            document.getElementById('docLicenseInput').value = profileData.licenseNumber || '';
            document.getElementById('docExpInput').value = profileData.experienceYears ?? 0;
        }

        async function saveProfile() {
            const token = localStorage.getItem('jwtToken');
            const doctorId = getUserIdFromToken(token);
            const payload = {
                fullName: document.getElementById('docNameInput').value.trim(),
                specialization: document.getElementById('docSpecInput').value.trim(),
                email: document.getElementById('docEmailInput').value.trim(),
                licenseNumber: document.getElementById('docLicenseInput').value.trim(),
                experienceYears: parseInt(document.getElementById('docExpInput').value || '0', 10)
            };

            if (!payload.fullName || !payload.specialization || !payload.email || !payload.licenseNumber) {
                showProfileMessage("Please fill all profile fields before saving.", "error");
                return;
            }

            try {
                const response = await fetch(`/api/doctor/${doctorId}/profile`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error("Failed to update profile");

                if (selectedPhotoFile) {
                    await uploadSelectedPhoto(token, doctorId);
                }

                localStorage.setItem('userEmail', payload.email);
                showProfileMessage("Profile updated successfully.", "success");
                await loadProfile();
                isEditMode = false;
                toggleProfileEditUI(false);
                clearSelectedPhoto();
            } catch (error) {
                console.error(error);
                showProfileMessage("Failed to update profile.", "error");
            }
        }

        function openPhotoPicker() {
            if (!isEditMode) return;
            document.getElementById('photoInput').click();
        }

        function handlePhotoSelected(event) {
            const file = event.target.files?.[0];
            if (!file) {
                clearUploadMessage();
                return;
            }
            const validationError = validatePhoto(file);
            if (validationError) {
                selectedPhotoFile = null;
                event.target.value = '';
                showUploadMessage(validationError, true);
                return;
            }
            selectedPhotoFile = file;
            document.getElementById('selectedPhotoName').textContent = file.name;
            clearUploadMessage();
            if (selectedPhotoPreviewUrl) URL.revokeObjectURL(selectedPhotoPreviewUrl);
            selectedPhotoPreviewUrl = URL.createObjectURL(file);
            document.getElementById('profileImg').src = selectedPhotoPreviewUrl;
        }

        function validatePhoto(file) {
            const allowed = ['image/jpeg', 'image/png'];
            if (!allowed.includes(file.type)) {
                return 'Please upload a JPG or PNG image.';
            }
            const maxBytes = 2 * 1024 * 1024;
            if (file.size > maxBytes) {
                return 'Image must be smaller than 2 MB.';
            }
            return null;
        }

        async function uploadSelectedPhoto(token, doctorId) {
            const formData = new FormData();
            formData.append('file', selectedPhotoFile);
            const response = await fetch(`/api/doctor/${doctorId}/upload-photo`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` },
                body: formData
            });
            if (!response.ok) throw new Error('Photo upload failed');
        }

        function clearSelectedPhoto() {
            selectedPhotoFile = null;
            document.getElementById('photoInput').value = '';
            document.getElementById('selectedPhotoName').textContent = 'No file selected';
            if (selectedPhotoPreviewUrl) {
                URL.revokeObjectURL(selectedPhotoPreviewUrl);
                selectedPhotoPreviewUrl = null;
            }
            clearUploadMessage();
        }

        function showUploadMessage(msg, isError = false) {
            const msgDiv = document.getElementById('uploadMessage');
            msgDiv.className = isError ? 'alert alert-danger' : 'alert alert-success';
            msgDiv.textContent = msg;
        }

        function clearUploadMessage() {
            const msgDiv = document.getElementById('uploadMessage');
            msgDiv.className = 'helper-text';
            msgDiv.textContent = '';
        }

        function showProfileMessage(message, type = "success") {
            const el = document.getElementById('profileMessage');
            if (!message) {
                el.style.display = 'none';
                return;
            }
            el.className = type === 'success' ? 'alert alert-success' : 'alert alert-danger';
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 5000);
        }
    </script>
</body>

</html>
