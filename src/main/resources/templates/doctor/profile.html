<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile - HealSync</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
</head>

<body>
    <!-- /* Redesigned: Doctor Profile â€” follows clinical design system v1 */ -->
    <div class="app-shell">
        <div th:replace="fragments/doctor-navbar :: navbar"></div>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-title-group">
                    <p class="breadcrumb">Doctor / Profile</p>
                    <h1>Profile</h1>
                </div>
            </header>

            <main class="page-content">
                <section class="card">
                    <div class="profile-hero">
                        <img id="profileImg" src="/images/default-doctor.svg" alt="Doctor Profile" class="avatar-circle large" style="object-fit: cover;" onerror="handleDoctorImageError(this)">
                        <div class="text-center">
                            <h2 id="docName">Loading...</h2>
                            <p class="section-copy" id="docSpec">Loading...</p>
                        </div>
                    </div>

                    <div class="details-grid">
                        <div class="detail-card"><label>Email</label><span id="docEmail">Loading...</span></div>
                        <div class="detail-card"><label>License Number</label><span id="docLicense">Loading...</span></div>
                        <div class="detail-card"><label>Experience</label><span id="docExp">Loading...</span></div>
                        <div class="detail-card"><label>Clinic ID</label><span id="docClinic">Loading...</span></div>
                    </div>

                    <section style="margin-top: 24px;">
                        <div class="section-header">
                            <div>
                                <h2>Update profile photo</h2>
                                <p class="section-copy">Supported formats: JPG, PNG. Maximum size 2 MB.</p>
                            </div>
                        </div>
                        <form id="uploadForm" onsubmit="uploadPhoto(event)" class="horizontal-actions">
                            <input type="file" name="file" id="photoInput" accept="image/*" onchange="uploadPhoto(event)">
                        </form>
                        <div id="uploadMessage" class="helper-text" style="margin-top: 12px;"></div>
                    </section>
                </section>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadProfile();
        });

        const DEFAULT_DOCTOR_IMAGE = '/images/default-doctor.svg';

        async function loadProfile() {
            const token = localStorage.getItem('jwtToken');
            const doctorId = getUserIdFromToken(token);

            if (!token || !doctorId) {
                window.location.href = '/login';
                return;
            }

            try {
                const response = await fetch(`/api/doctor/${doctorId}/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Failed to load profile");

                const profile = await response.json();
                const email = localStorage.getItem('userEmail') || 'N/A';

                document.getElementById('docName').innerText = profile.fullName;
                document.getElementById('docSpec').innerText = profile.specialization;
                document.getElementById('docEmail').innerText = email;
                document.getElementById('docLicense').innerText = profile.licenseNumber;
                document.getElementById('docExp').innerText = profile.experienceYears + " Years";
                document.getElementById('docClinic').innerText = profile.clinicId;
                document.getElementById('profileImg').src = getDoctorPhotoUrl(profile.profilePhotoUrl);
            } catch (error) {
                console.error(error);
                alert("Error loading profile data.");
            }
        }

        async function uploadPhoto(event) {
            event.preventDefault();

            const fileInput = document.getElementById('photoInput');
            const file = fileInput.files[0];
            if (!file) return;

            const token = localStorage.getItem('jwtToken');
            const doctorId = getUserIdFromToken(token);
            const msgDiv = document.getElementById('uploadMessage');

            msgDiv.innerText = "Uploading...";

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch(`/api/doctor/${doctorId}/upload-photo`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (!response.ok) throw new Error("Upload failed");
                const result = await response.json();
                document.getElementById('profileImg').src = getDoctorPhotoUrl(result.url);
                msgDiv.innerText = "Profile photo updated successfully.";
            } catch (error) {
                console.error(error);
                msgDiv.innerText = "Failed to upload photo.";
            }
        }

        function getUserIdFromToken() {
            return localStorage.getItem('userId');
        }

        function getDoctorPhotoUrl(photoUrl) {
            if (!photoUrl || !photoUrl.trim()) return DEFAULT_DOCTOR_IMAGE;
            return photoUrl.trim();
        }

        function handleDoctorImageError(img) {
            if (img.dataset.fallbackApplied === 'true') return;
            img.dataset.fallbackApplied = 'true';
            img.src = DEFAULT_DOCTOR_IMAGE;
        }
    </script>
</body>

</html>
